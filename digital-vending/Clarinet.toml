[project]
name = "digital-vending-machine"
description = "A digital vending machine smart contract with weighted prizes and enhanced security"
version = "2.0.0"
authors = ["midorichie@MIDO"]
license = "MIT"
keywords = ["vending", "nft", "fungible-token", "gaming", "prizes"]

[contracts.digital-vending]
path = "contracts/digital-vending.clar"
clarity_version = 2
epoch = "3.0"

[project.requirements]
clarinet = ">=2.0.0"

[repl]
costs_version = 3
parser_version = 2

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

# Development network configuration
[devnet]
disable_stacks_explorer = false
disable_stacks_api = false
